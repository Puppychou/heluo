<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>河洛理數・先天卦(正宗版)</title>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
<style>
  :root{--bg:#141821;--card:#1c2230;--ink:#e8ecf4;--dim:#8b93a7;--line:#2c3444;
    --accent:#c9a35b;--accent2:#7fb0e0;--red:#d9857f;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.6;padding:22px 14px}
  .wrap{max-width:600px;margin:0 auto}
  h1{font-size:21px;text-align:center;letter-spacing:3px;margin:6px 0 2px;color:var(--accent)}
  .sub{text-align:center;color:var(--dim);font-size:12.5px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 20px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input,select{background:#0f131b;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 10px;font-size:15px;width:100%}
  .row>div{flex:1;min-width:0}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;background:#0f131b;border:1px solid var(--line);color:var(--dim);padding:9px;border-radius:9px;font-size:14px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:700}
  .go{width:100%;margin-top:16px;background:var(--accent);color:#1a1408;border:none;padding:13px;border-radius:10px;font-size:16px;font-weight:700;letter-spacing:3px;cursor:pointer}
  #out{display:none}
  .kv{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px dashed var(--line)}
  .kv b{color:var(--accent2);font-weight:600}
  table{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
  th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:12.5px}
  td.gz{font-size:18px;letter-spacing:2px}
  .nums{font-size:13px;color:var(--dim);margin:8px 0;text-align:center}
  .sums{display:flex;gap:12px;margin-top:8px}
  .sums div{flex:1;background:#0f131b;border:1px solid var(--line);border-radius:10px;text-align:center;padding:10px}
  .sums span{display:block;color:var(--dim);font-size:12px}
  .sums b{font-size:20px;color:var(--accent)}
  .gua{text-align:center;margin:14px 0 4px}
  .gua .nm{font-size:30px;letter-spacing:8px;color:var(--accent);margin-bottom:2px}
  .gua .meta{color:var(--dim);font-size:12.5px;margin-bottom:10px}
  .ln{display:flex;align-items:center;gap:10px;margin:5px 0;justify-content:center}
  .ln .p{color:var(--dim);font-size:11px;width:30px;text-align:right}
  .bar i{display:inline-block;height:11px;background:var(--ink);border-radius:2px}
  .note{font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
  .note b{color:var(--red)}
  .err{color:var(--red);text-align:center;padding:8px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>河 洛 理 數 ・ 先 天 卦</h1>
  <div class="sub">正宗取數(天干洛書＋地支河圖)・真太陽時・10 盤驗證</div>

  <div class="card">
    <label>曆別</label>
    <div class="seg" id="cal"><button class="on" data-v="solar">國曆</button><button data-v="lunar">農曆</button></div>
    <div class="row">
      <div style="flex:1.4"><label>年</label><input id="y" type="number"></div>
      <div><label>月</label><input id="m" type="number"></div>
      <div><label>日</label><input id="d" type="number"></div>
    </div>
    <div class="row">
      <div><label>時 (0–23)</label><input id="h" type="number"></div>
      <div><label>分</label><input id="mi" type="number"></div>
    </div>
    <label>性別</label>
    <div class="seg" id="sex"><button class="on" data-v="male">男</button><button data-v="female">女</button></div>
    <label>真太陽時校正 <span style="color:var(--dim)">(經度)</span></label>
    <div class="row">
      <div class="seg" id="tst" style="flex:2"><button class="on" data-v="on">開(對齊命理軟體)</button><button data-v="off">關(用時鐘)</button></div>
      <div><input id="lon" type="number" step="0.1" value="121.5"></div>
    </div>
    <button class="go" onclick="run()">起　卦</button>
  </div>
  <div class="card" id="out"></div>
</div>

<script>
const GAN_L={甲:6,乙:2,丙:8,丁:7,戊:1,己:9,庚:3,辛:4,壬:6,癸:2};
const ZHI_H={子:[1,6],亥:[1,6],寅:[3,8],卯:[3,8],巳:[2,7],午:[2,7],
             申:[4,9],酉:[4,9],辰:[5,10],戌:[5,10],丑:[5,10],未:[5,10]};
const YANG_GAN=new Set(['甲','丙','戊','庚','壬']);
const LUOSHU={1:['坎',[0,1,0]],2:['坤',[0,0,0]],3:['震',[1,0,0]],4:['巽',[0,1,1]],
              6:['乾',[1,1,1]],7:['兌',[1,1,0]],8:['艮',[0,0,1]],9:['離',[1,0,1]]};
const BITS={乾:[1,1,1],兌:[1,1,0],離:[1,0,1],震:[1,0,0],巽:[0,1,1],坎:[0,1,0],艮:[0,0,1],坤:[0,0,0]};
const ORDER=["乾","兌","離","震","巽","坎","艮","坤"];
const HEX={
乾:["乾為天","天澤履","天火同人","天雷无妄","天風姤","天水訟","天山遯","天地否"],
兌:["澤天夬","兌為澤","澤火革","澤雷隨","澤風大過","澤水困","澤山咸","澤地萃"],
離:["火天大有","火澤睽","離為火","火雷噬嗑","火風鼎","火水未濟","火山旅","火地晉"],
震:["雷天大壯","雷澤歸妹","雷火豐","震為雷","雷風恆","雷水解","雷山小過","雷地豫"],
巽:["風天小畜","風澤中孚","風火家人","風雷益","巽為風","風水渙","風山漸","風地觀"],
坎:["水天需","水澤節","水火既濟","水雷屯","水風井","坎為水","水山蹇","水地比"],
艮:["山天大畜","山澤損","山火賁","山雷頤","山風蠱","山水蒙","艮為山","山地剝"],
坤:["地天泰","地澤臨","地火明夷","地雷復","地風升","地水師","地山謙","坤為地"]};
const hexName=(up,lo)=>HEX[up][ORDER.indexOf(lo)];

document.querySelectorAll(".seg").forEach(s=>s.addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  s.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
  e.target.classList.add("on"); s.dataset.val=e.target.dataset.v;}));
const seg=(id,def)=>document.getElementById(id).dataset.val||def;

function trueSolar(y,m,d,h,mi,lon){
  const dt=new Date(y,m-1,d,h,mi);
  const start=new Date(y,0,0);
  const n=Math.floor((dt-start)/86400000);
  const b=2*Math.PI*(n-81)/365;
  const eot=9.87*Math.sin(2*b)-7.53*Math.cos(b)-1.5*Math.sin(b);
  const off=4*(lon-120)+eot;
  return new Date(dt.getTime()+off*60000);
}
function zhong(male,yuan){ return yuan==="下"?(male?"離":"兌"):(male?"艮":"坤"); }
function toGua(num,base,male,yuan){
  let n=num; while(n>base) n-=base;
  let g; if(n%10===0) g=n/10; else if(n>10) g=n%10; else g=n;
  if(LUOSHU[g]) return [LUOSHU[g][0],false];
  return [zhong(male,yuan),true];
}
function yuanOf(y){ return y<=1923?"上":(y<=1983?"中":"下"); }
function bars(up,lo){
  const arr=[...BITS[lo],...BITS[up]]; let h="";
  for(let i=5;i>=0;i--){const yang=arr[i]===1;
    h+=`<div class="ln"><span class="p">${i+1}爻</span>`+
       (yang?'<span class="bar"><i style="width:70px"></i></span>'
            :'<span class="bar"><i style="width:30px"></i>&nbsp;<i style="width:30px"></i></span>')+`</div>`;}
  return h;
}

function run(){
  const out=document.getElementById("out"); out.style.display="block";
  if(typeof Solar==="undefined"){out.innerHTML='<div class="err">曆算元件未載入,請連網後重新整理。</div>';return;}
  const y=+y_.value,m=+m_.value,d=+d_.value,h=+h_.value,mi=+mi_.value||0;
  if(!y||!m||!d||isNaN(h)){out.innerHTML='<div class="err">請填年月日時。</div>';return;}
  const cal=seg("cal","solar"),male=seg("sex","male")==="male",
        tst=seg("tst","on")==="on",lon=+document.getElementById("lon").value||121.5;
  let solar,lunar,note="";
  try{
    if(cal==="lunar"){lunar=Lunar.fromYmdHms(y,m,d,h,mi,0);solar=lunar.getSolar();}
    else{
      let yy=y,mm=m,dd=d,hh=h,mn=mi;
      if(tst){const t=trueSolar(y,m,d,h,mi,lon);yy=t.getFullYear();mm=t.getMonth()+1;dd=t.getDate();hh=t.getHours();mn=t.getMinutes();
        note=`(真太陽時 ${String(hh).padStart(2,'0')}:${String(mn).padStart(2,'0')})`;}
      solar=Solar.fromYmdHms(yy,mm,dd,hh,mn,0);lunar=solar.getLunar();
    }
  }catch(e){out.innerHTML='<div class="err">日期無效:'+e+'</div>';return;}
  const ec=lunar.getEightChar();
  const P=[ec.getYear(),ec.getMonth(),ec.getDay(),ec.getTime()];
  const gans=P.map(p=>p[0]),zhis=P.map(p=>p[1]);
  const yy=YANG_GAN.has(gans[0]),yuan=yuanOf(solar.getYear());
  // 取數
  let pool=gans.map(g=>GAN_L[g]);
  zhis.forEach(z=>pool.push(...ZHI_H[z]));
  const tian=pool.filter(n=>n%2).reduce((a,b)=>a+b,0);
  const di=pool.filter(n=>n%2===0).reduce((a,b)=>a+b,0);
  const ming=(yy?"陽":"陰")+(male?"命男":"命女");
  const [tg,t5]=toGua(tian,25,male,yuan),[dg,d5]=toGua(di,30,male,yuan);
  let up,lo,pos;
  if((yy&&male)||(!yy&&!male)){up=tg;lo=dg;pos="天數卦在上、地數卦在下";}
  else{up=dg;lo=tg;pos="天數卦在下、地數卦在上";}
  const ben=hexName(up,lo);
  let rows="";P.forEach((gz,i)=>{const lab=["年","月","日","時"][i];
    rows+=`<tr><td>${lab}</td><td class="gz">${gz}</td></tr>`;});
  out.innerHTML=`
    <div class="kv"><span>國曆</span><b>${solar.toYmd()} ${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')} ${note}</b></div>
    <div class="kv"><span>農曆</span><b>${lunar.getYearInChinese()}年 ${lunar.getMonthInChinese()}月 ${lunar.getDayInChinese()} ${lunar.getTimeZhi()}時</b></div>
    <div class="kv"><span>生肖 / 命</span><b>${lunar.getYearShengXiao()} ・ ${ming}</b></div>
    <table><tr><th>柱</th><th>干支</th></tr>${rows}</table>
    <div class="nums">取數(天干洛書＋地支河圖，共12數):[${pool.join(", ")}]<br>奇數和＝天數、偶數和＝地數</div>
    <div class="sums">
      <div><span>天數(奇)</span><b>${tian}</b><span>→ ${tg}卦${t5?"(中宮)":""}</span></div>
      <div><span>地數(偶)</span><b>${di}</b><span>→ ${dg}卦${d5?"(中宮)":""}</span></div>
    </div>
    <div class="gua">
      <div class="nm">${ben}</div>
      <div class="meta">先天卦(本卦) ・ 上${up} 下${lo}<br>${ming} → ${pos}</div>
      ${bars(up,lo)}
    </div>
    <div class="note">
      取數/定卦/本卦依崔仁慧《河洛理數入門起例》+ 專家口述還原,已用 10 張正宗命盤 10/10 驗證。<br>
      <b>後天卦(變卦)尚未內建</b>(元堂表特例多,避免出錯);需要變卦請以 destiny.to 為準。
    </div>`;
}
const y_=document.getElementById('y'),m_=document.getElementById('m'),d_=document.getElementById('d'),
      h_=document.getElementById('h'),mi_=document.getElementById('mi');
</script>
</body>
</html>
